<text x="800" y="220.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">Edições: 31/08/2026  |  Obras: 30/09/2026</text>
<path d="M800 265 V288" stroke="#17324d" stroke-width="5"/><path d="M788 282 L812 282 L800 300 Z" fill="#17324d"/>
<rect x="100" y="305" width="1400" height="150" rx="18" fill="#f5f7fa" stroke="#8ca2b6" stroke-width="3"/>
<text x="800" y="373.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">Normalização da CDD e recorte de 43 códigos</text>
<text x="800" y="417.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">4.300 edições: 100 por código, limitadas pela ordem do dump</text>
<path d="M800 460 V483" stroke="#17324d" stroke-width="5"/><path d="M788 477 L812 477 L800 495 Z" fill="#17324d"/>
<rect x="100" y="500" width="1400" height="190" rx="18" fill="#f5f7fa" stroke="#8ca2b6" stroke-width="3"/>
<text x="800" y="566.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">Enriquecimento com assuntos e divisão agrupada por obra</text>
<text x="800" y="610.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">Estratificação por CDD; semente 42; proporção 60/20/20</text>
<text x="800" y="654.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">Filtro de assuntos não vazios: 4.034 registros</text>
<path d="M800 695 V718" stroke="#17324d" stroke-width="5"/><path d="M788 712 L812 712 L800 730 Z" fill="#17324d"/>
<rect x="100" y="735" width="1400" height="260" rx="18" fill="#eaf1f8" stroke="#8ca2b6" stroke-width="3"/>
<text x="800" y="814.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">Treino: 2.423  |  Validação: 803</text>
<text x="800" y="858.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">TF-IDF de palavras + regressão logística (C = 10)</text>
<text x="800" y="902.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">XLM-R com agregação por autoatenção; encoder preservado</text>
<text x="800" y="946.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">Ensemble: XLM-R-AA (0,45) + kNN de caracteres (0,55; k = 9)</text>
<path d="M800 1000 V1023" stroke="#17324d" stroke-width="5"/><path d="M788 1017 L812 1017 L800 1035 Z" fill="#17324d"/>
<rect x="100" y="1040" width="1400" height="150" rx="18" fill="#f5f7fa" stroke="#8ca2b6" stroke-width="3"/>
<text x="800" y="1108.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">Teste: 808 registros</text>
<text x="800" y="1152.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">Aplicação das configurações registradas; sem novo ajuste</text>
<path d="M800 1195 V1218" stroke="#17324d" stroke-width="5"/><path d="M788 1212 L812 1212 L800 1230 Z" fill="#17324d"/>
<rect x="100" y="1235" width="1400" height="190" rx="18" fill="#f5f7fa" stroke="#8ca2b6" stroke-width="3"/>
<text x="800" y="1301.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">Avaliação e inspeção dos erros</text>
<text x="800" y="1345.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">Acurácia, macro-F1, níveis CDD; McNemar, Holm e Stuart–Maxwell</text>
<text x="800" y="1389.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="normal" fill="#17324d">Auditoria de IDs e títulos; análise de sensibilidade pós-hoc</text>
<rect x="100" y="1470" width="1400" height="130" rx="14" fill="#fff5e8" stroke="#b7772e" stroke-width="2"/>
<text x="800" y="1520" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="#80501b">Ressalva: os escores neurais arquivados para a validação do ensemble</text>
<text x="800" y="1562" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="#80501b">divergem das previsões de validação do método neural isolado.</text>
</svg>
